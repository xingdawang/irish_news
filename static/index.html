<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>爱尔兰新闻简报</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:920px;margin:40px auto;padding:0 20px;color:#17202a;line-height:1.65}header{border-bottom:1px solid #ddd;margin-bottom:24px}.meta{color:#667085}.warn{background:#fff4e5;padding:10px 14px;border-radius:8px}.item{margin:22px 0}.item h3{margin-bottom:4px}a{color:#175cd3}</style></head><body><header><h1 id="title">🇮🇪 爱尔兰新闻简报</h1><p class="meta" id="meta">正在读取最新一期…</p><p id="stale"></p></header><main id="content"></main><script>
const groups={housing:"🏠 住房与规划",tech:"💻 IT/科技/就业",other:"📍 其他重要新闻"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const r=await fetch("/api/news/latest",{cache:"no-store"});if(!r.ok){document.getElementById("meta").textContent="暂时没有已发布简报";return}const d=await r.json(),e=d.edition||{};document.getElementById("title").textContent=e.title||"🇮🇪 爱尔兰新闻简报";document.getElementById("meta").textContent="都柏林时间："+(e.scheduled_at||"")+" ｜ 本期 "+(d.item_count||0)+" 条 ｜ 住房 & IT 优先 · 严格跨期去重";if(Date.now()-Date.parse(d.updated_at)>18*3600*1000)document.getElementById("stale").innerHTML='<span class="warn">⚠️ 已超过 18 小时未更新</span>';let html="";for(const [key,label] of Object.entries(groups)){const items=(d.items||[]).filter(x=>x.category===key);if(!items.length)continue;html+="<h2>"+label+"</h2>";for(const x of items)html+='<article class="item"><h3>'+esc(x.title)+'</h3><div>'+esc(x.summary)+'</div><div class="meta">来源：'+esc(x.source_name)+' · <a href="'+esc(x.source_url)+'" target="_blank" rel="noopener noreferrer">原文</a></div></article>';}document.getElementById("content").innerHTML=html;}load();
</script></body></html>
